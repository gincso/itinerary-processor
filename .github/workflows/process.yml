name: Process Itinerary

on:
  push:
    paths:
      - 'itinerary.md'

jobs:
  process:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas geopy folium
    
    - name: Process itinerary
      run: |
        python -c "from handler import process_itinerary; import asyncio; asyncio.run(process_itinerary('itinerary.md', '.'))"
    
    - name: Upload results
      uses: actions/upload-artifact@v4
      with:
        name: itinerary-results
        path: |
          optimized_route.csv
          optimized_route.html

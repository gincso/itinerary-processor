name: Process Itinerary

on:
  push:
    paths:
      - 'itinerary.md'
  workflow_dispatch:
    inputs:
      itinerary:
        description: 'Itinerary file path'
        required: true
        default: 'itinerary.md'

jobs:
  process:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas geopy folium googlemaps

    - name: Process itinerary
      env:
        GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      run: |
        python -c "from handler import process_itinerary; import asyncio; asyncio.run(process_itinerary('${{ github.event.inputs.itinerary || 'itinerary.md' }}', '.'))"

    - name: Upload results
      uses: actions/upload-artifact@v4
      with:
        name: itinerary-results
        path: |
          optimized_route.csv
          optimized_route.html

    - name: Create PR with results
      if: github.ref == 'refs/heads/main'
      uses: peter-evans/create-pull-request@v5
      with:
        title: 'Updated itinerary results'
        branch: 'update-itinerary-results'
        commit-message: 'Update optimized itinerary route'

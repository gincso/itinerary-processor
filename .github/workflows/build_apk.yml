name: Build Mobile APK

on:
  push:
    branches: [ main ]
    paths:
      - 'mobile/**'
      - '.github/workflows/build_apk.yml'
  release:
    types: [ created ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Android dependencies
      run: |
        sudo apt update
        sudo apt install -y git zip unzip openjdk-17-jdk \
          python3-pip autoconf automake libtool pkg-config zlib1g-dev \
          libncurses-dev cmake \
          libffi-dev libssl-dev

    - name: Install Buildozer with Python 3.11
      run: |
        python -m pip install --upgrade pip
        pip install buildozer python-for-android

    - name: Build APK
      working-directory: ./mobile
      run: |
        buildozer -v android debug

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: itinerary-driver-apk
        path: mobile/bin/*.apk

    - name: Upload APK to release
      if: github.event_name == 'release'
      uses: softprops/action-gh-release@v1
      with:
        files: mobile/bin/*.apk